<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>تسجيل الدخول | NATAC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #eaf1ff;
      --bg-2: #f7f1ea;
      --text: #101827;
      --muted: #667085;
      --line: rgba(16, 24, 39, 0.12);
      --card: rgba(255, 255, 255, 0.90);
      --card-strong: rgba(255, 255, 255, 0.98);
      --input: rgba(255, 255, 255, 0.98);
      --blue: #0066ff;
      --blue-dark: #004ec2;
      --purple: #6d28d9;
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 22px 60px rgba(16, 24, 39, 0.14);
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 12%, rgba(0, 102, 255, 0.28), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(109, 40, 217, 0.20), transparent 30%),
        linear-gradient(135deg, var(--bg-1), #ffffff 52%, var(--bg-2));
      background-attachment: fixed;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .login-card {
      width: min(440px, 100%);
      padding: 24px;
      border-radius: var(--radius-xl);
      background: var(--card);
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
    }

    .login-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(16,24,39,0.10);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-box {
      width: 54px;
      height: 54px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(16,24,39,0.08);
      flex-shrink: 0;
    }

    .logo-box img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      min-width: 0;
      text-align: start;
    }

    .brand-title strong {
      display: block;
      font-size: 21px;
      font-weight: 900;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .language-toggle {
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
      min-width: 44px;
      height: 42px;
      font-size: 16px;
      flex-shrink: 0;
    }

    .form-title {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.4px;
      text-align: start;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      text-align: start;
    }

    input {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(16,24,39,0.18);
      border-radius: 16px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 15px;
      background: var(--input);
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 0 rgba(16,24,39,0.03);
      transition: 0.18s ease;
    }

    input::placeholder {
      color: #98a2b3;
    }

    input:focus {
      border-color: rgba(0, 102, 255, 0.65);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.13);
      background: #fff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-inline-end: 52px;
    }

    .toggle-password {
      position: absolute;
      inset-inline-end: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 13px;
      background: rgba(0, 102, 255, 0.08);
      color: var(--blue-dark);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      padding: 0 22px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
      margin-top: 6px;
    }

    .btn-primary {
      background: linear-gradient(145deg, #0066ff, #5b21b6);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 102, 255, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(0, 102, 255, 0.27);
    }

    .btn:disabled {
      opacity: 0.68;
      cursor: not-allowed;
      transform: none;
    }

    .mini-spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.45);
      border-top-color: #fff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.75s linear infinite;
    }

    .message {
      display: none;
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      min-width: min(520px, calc(100vw - 28px));
      max-width: calc(100vw - 28px);
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.7;
      border: 1px solid transparent;
      box-shadow: 0 18px 48px rgba(16, 24, 39, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: rgba(254, 242, 242, 0.96);
      border-color: #fecaca;
    }

    .message.success {
      display: block;
      color: #166534;
      background: rgba(240, 253, 244, 0.96);
      border-color: #bbf7d0;
    }

    .message.warning {
      display: block;
      color: #9a3412;
      background: rgba(255, 247, 237, 0.96);
      border-color: #fed7aa;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 18px;
        border-radius: 24px;
      }

      .logo-box {
        width: 50px;
        height: 50px;
      }

      .brand-title strong {
        font-size: 19px;
      }

      .form-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <div id="messageBox" class="message"></div>

  <main class="login-card">
    <div class="login-head">
      <div class="brand">
        <div class="logo-box">
          <img src="assets/img/logo.png" alt="NATAC Logo">
        </div>
        <div class="brand-title">
          <strong id="factoryName">ناتاك</strong>
        </div>
      </div>

      <button id="languageToggleBtn" class="language-toggle" type="button">EN</button>
    </div>

    <h1 class="form-title" id="loginTitle">تسجيل الدخول</h1>

    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label for="username" id="usernameLabel">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password" id="passwordLabel">كلمة المرور</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" />
          <button id="togglePasswordBtn" class="toggle-password" type="button">👁</button>
        </div>
      </div>

      <button class="btn btn-primary" type="submit" id="loginBtn">دخول</button>
    </form>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyqTi-fYEKbC2l_GY0LHk8AFsKhxJgFBCc7ryThqzq6r3QAHTn9liQS3bXMbDDWygvd/exec?";
    const SESSION_KEY = "factoryUserSession";
    const LANGUAGE_KEY = "factoryLanguage";

    const i18n = {
      ar: {
        htmlLang: "ar",
        dir: "rtl",
        pageTitle: "تسجيل الدخول | ناتاك",
        languageButton: "EN",
        factoryName: "ناتاك",
        loginTitle: "تسجيل الدخول",
        username: "اسم المستخدم",
        password: "كلمة المرور",
        login: "دخول",
        loggingIn: "جاري الدخول...",
        missingFields: "يرجى إدخال اسم المستخدم وكلمة المرور",
        loginSuccess: "تم تسجيل الدخول بنجاح",
        serverError: "تعذر الاتصال بالخادم. تحقق من رابط Apps Script أو اتصال الإنترنت.",
        sessionExpired: "انتهت الجلسة، يرجى تسجيل الدخول مرة أخرى"
      },
      en: {
        htmlLang: "en",
        dir: "ltr",
        pageTitle: "Login | NATAC",
        languageButton: "عربي",
        factoryName: "NATAC",
        loginTitle: "Login",
        username: "Username",
        password: "Password",
        login: "Login",
        loggingIn: "Signing in...",
        missingFields: "Please enter username and password",
        loginSuccess: "Signed in successfully",
        serverError: "Unable to connect to the server. Check Apps Script URL or internet connection.",
        sessionExpired: "Session expired. Please sign in again"
      }
    };

    let currentLang = localStorage.getItem(LANGUAGE_KEY) || "ar";
    let messageTimer = null;

    const messageBox = document.getElementById("messageBox");
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const languageToggleBtn = document.getElementById("languageToggleBtn");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    const factoryName = document.getElementById("factoryName");
    const loginTitle = document.getElementById("loginTitle");
    const usernameLabel = document.getElementById("usernameLabel");
    const passwordLabel = document.getElementById("passwordLabel");

    document.addEventListener("DOMContentLoaded", () => {
      applyLanguage(currentLang);
      checkExistingSession();
      bindEvents();
    });

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANGUAGE_KEY, lang);

      document.documentElement.lang = i18n[lang].htmlLang;
      document.documentElement.dir = i18n[lang].dir;
      document.title = i18n[lang].pageTitle;

      factoryName.textContent = i18n[lang].factoryName;
      loginTitle.textContent = i18n[lang].loginTitle;
      usernameLabel.textContent = i18n[lang].username;
      passwordLabel.textContent = i18n[lang].password;
      loginBtn.textContent = i18n[lang].login;
      languageToggleBtn.textContent = i18n[lang].languageButton;
    }

    function bindEvents() {
      languageToggleBtn.addEventListener("click", () => {
        const nextLang = currentLang === "ar" ? "en" : "ar";
        applyLanguage(nextLang);
      });

      togglePasswordBtn.addEventListener("click", () => {
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
      });

      loginForm.addEventListener("submit", handleLogin);
    }

    async function checkExistingSession() {
      const session = getSession();

      if (!session || !session.token) {
        return;
      }

      try {
        const result = await apiPost({
          action: "checkSession",
          token: session.token
        });

        if (result && result.success) {
          const user = result.user || session.user || {};
          saveSession(session.token, user);
          window.location.href = "dashboard.html";
        } else {
          localStorage.removeItem(SESSION_KEY);
        }

      } catch (error) {
        console.warn(error);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      clearMessage();

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        showMessage(i18n[currentLang].missingFields, "error");
        return;
      }

      setLoading(true);

      try {
        const result = await apiPost({
          action: "login",
          username: username,
          password: password
        });

        if (!result || !result.success) {
          setLoading(false);
          showMessage((result && result.message) || i18n[currentLang].serverError, "error");
          return;
        }

        saveSession(result.token, result.user || {});
        showMessage(result.message || i18n[currentLang].loginSuccess, "success");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 450);

      } catch (error) {
        console.error(error);
        setLoading(false);
        showMessage(i18n[currentLang].serverError, "error");
      }
    }

    async function apiPost(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return await response.json();
    }

    function saveSession(token, user) {
      const session = {
        token: token,
        user: user,
        UserID: user.UserID || "",
        FullName: user.FullName || "",
        Username: user.Username || "",
        Role: user.Role || "",
        Status: user.Status || ""
      };

      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    }

    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (error) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }

    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;

      if (isLoading) {
        loginBtn.innerHTML = '<span class="mini-spinner"></span>' + i18n[currentLang].loggingIn;
      } else {
        loginBtn.textContent = i18n[currentLang].login;
      }
    }

    function showMessage(text, type) {
      clearTimeout(messageTimer);

      messageBox.textContent = text;
      messageBox.className = "message " + type;

      messageTimer = setTimeout(() => {
        clearMessage();
      }, 3000);
    }

    function clearMessage() {
      clearTimeout(messageTimer);
      messageBox.textContent = "";
      messageBox.className = "message";
    }
  </script>
</body>
</html>
