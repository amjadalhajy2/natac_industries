<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>تقييم المشرف | NATAC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #eaf1ff;
      --bg-2: #f7f1ea;
      --text: #101827;
      --muted: #667085;
      --line: rgba(16, 24, 39, 0.12);
      --card: rgba(255, 255, 255, 0.88);
      --input: rgba(255, 255, 255, 0.98);
      --blue: #0066ff;
      --blue-dark: #004ec2;
      --purple: #6d28d9;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #f97316;
      --shadow: 0 22px 60px rgba(16, 24, 39, 0.14);
      --topbar-height: 78px;
      --sidebar-width: 310px;
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 12%, rgba(0, 102, 255, 0.28), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(109, 40, 217, 0.20), transparent 30%),
        linear-gradient(135deg, var(--bg-1), #ffffff 52%, var(--bg-2));
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .floating-topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      min-height: var(--topbar-height);
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(16, 24, 39, 0.10);
      box-shadow: 0 12px 32px rgba(16, 24, 39, 0.10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 22px;
    }

    .topbar-side {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .menu-btn,
    .language-toggle {
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      font-size: 30px;
      display: grid;
      place-items: center;
    }

    .language-toggle {
      min-width: 44px;
      height: 42px;
      font-size: 16px;
    }

    .factory-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .factory-logo,
    .sidebar-logo {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(16,24,39,0.08);
      flex-shrink: 0;
    }

    .factory-logo {
      width: 50px;
      height: 50px;
      border-radius: 18px;
    }

    .sidebar-logo {
      width: 49px;
      height: 49px;
      border-radius: 18px;
    }

    .factory-logo img,
    .sidebar-logo img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    .factory-info,
    .user-info,
    .sidebar-title {
      min-width: 0;
      text-align: start;
    }

    .factory-info strong {
      display: block;
      font-size: 19px;
      font-weight: 900;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .factory-info span {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-menu-wrapper {
      position: relative;
    }

    .top-user-box {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      color: var(--text);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--blue), var(--purple));
      color: #fff;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(0,102,255,0.20);
    }

    .user-info strong,
    .user-info span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-info strong {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
    }

    .user-info span {
      margin-top: 1px;
      font-size: 12px;
      color: var(--muted);
    }

    .user-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      inset-inline-end: 0;
      width: 235px;
      z-index: 500;
      padding: 10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: 0 18px 48px rgba(16,24,39,0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .user-dropdown.show {
      display: grid;
    }

    .user-dropdown a,
    .user-dropdown button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-bottom: 1px solid rgba(16,24,39,0.08);
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: start;
      padding: 0 4px;
    }

    .user-dropdown a:last-child,
    .user-dropdown button:last-child {
      border-bottom: 0;
    }

    .user-dropdown a:hover,
    .user-dropdown button:hover {
      color: var(--blue-dark);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(16, 24, 39, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay.show {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      max-width: 88vw;
      height: 100vh;
      z-index: 200;
      padding: 22px 18px;
      overflow-y: auto;
      transform: translateX(105%);
      transition: transform 0.26s cubic-bezier(.2,.8,.2,1);
      background: rgba(255,255,255,0.94);
      border-left: 1px solid rgba(16,24,39,0.10);
      box-shadow: -28px 0 70px rgba(16, 24, 39, 0.18);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    html[dir="ltr"] .sidebar {
      right: auto;
      left: 0;
      transform: translateX(-105%);
      border-left: 0;
      border-right: 1px solid rgba(16,24,39,0.10);
      box-shadow: 28px 0 70px rgba(16, 24, 39, 0.18);
    }

    .sidebar.open,
    html[dir="ltr"] .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .sidebar-title strong {
      display: block;
      font-size: 16px;
      font-weight: 900;
    }

    .sidebar-title span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .close-sidebar {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 14px;
      background: rgba(220, 38, 38, 0.08);
      color: var(--red);
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav {
      display: grid;
    }

    .nav a {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      padding: 13px 4px;
      border: 0;
      border-bottom: 1px solid rgba(16,24,39,0.10);
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      text-align: start;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .nav a:hover {
      color: var(--blue-dark);
      padding-inline-start: 10px;
    }

    .nav a.active {
      color: var(--blue-dark);
    }

    .nav-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 116px 24px 32px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 22px;
      border-radius: var(--radius-xl);
      background: var(--card);
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
    }

    .panel-content {
      position: relative;
      z-index: 1;
    }

    .page-title {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(16,24,39,0.10);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      text-align: start;
    }

    .page-title h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
      text-align: start;
    }

    label {
      font-weight: 900;
      color: var(--text);
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(16,24,39,0.18);
      border-radius: 16px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 15px;
      background: var(--input);
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 0 rgba(16,24,39,0.03);
      transition: 0.18s ease;
    }

    input:focus,
    select:focus {
      border-color: rgba(0, 102, 255, 0.65);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.13);
      background: #fff;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .score-card {
      background: #fff;
      border: 1px solid rgba(16,24,39,0.10);
      border-radius: 22px;
      padding: 15px;
      box-shadow: 0 10px 24px rgba(16,24,39,0.06);
      display: grid;
      gap: 10px;
    }

    .score-card label {
      font-size: 15px;
      line-height: 1.6;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: #fff;
      border: 1px solid rgba(16,24,39,0.10);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 24px rgba(16,24,39,0.06);
      text-align: start;
    }

    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .summary-card strong {
      display: block;
      color: var(--text);
      font-size: 26px;
      font-weight: 900;
      direction: ltr;
      text-align: start;
      font-family: Arial, sans-serif;
    }

    .level-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .level-excellent {
      background: rgba(22, 163, 74, 0.10);
      color: #166534;
      border-color: rgba(22, 163, 74, 0.22);
    }

    .level-good {
      background: rgba(0, 102, 255, 0.10);
      color: var(--blue-dark);
      border-color: rgba(0, 102, 255, 0.22);
    }

    .level-average {
      background: rgba(249, 115, 22, 0.10);
      color: #9a3412;
      border-color: rgba(249, 115, 22, 0.22);
    }

    .level-weak {
      background: rgba(220, 38, 38, 0.10);
      color: #991b1b;
      border-color: rgba(220, 38, 38, 0.22);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(145deg, #0066ff, #5b21b6);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 102, 255, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(0, 102, 255, 0.27);
    }

    .btn-secondary {
      background: #fff;
      color: var(--blue-dark);
      border: 1px solid rgba(0, 102, 255, 0.28);
      box-shadow: 0 8px 20px rgba(16,24,39,0.06);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 900;
      margin-bottom: 16px;
      padding: 13px 15px;
      width: fit-content;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: 0 8px 22px rgba(16,24,39,0.07);
    }

    .spinner,
    .mini-spinner {
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 102, 255, 0.14);
      border-top-color: var(--blue);
    }

    .mini-spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.45);
      border-top-color: #fff;
      display: inline-block;
    }

    .message {
      display: none;
      position: fixed;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      min-width: min(520px, calc(100vw - 28px));
      max-width: calc(100vw - 28px);
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.7;
      border: 1px solid transparent;
      box-shadow: 0 18px 48px rgba(16, 24, 39, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: rgba(254, 242, 242, 0.98);
      border-color: #fecaca;
    }

    .message.success {
      display: block;
      color: #166534;
      background: rgba(240, 253, 244, 0.98);
      border-color: #bbf7d0;
    }

    .message.warning {
      display: block;
      color: #9a3412;
      background: rgba(255, 247, 237, 0.98);
      border-color: #fed7aa;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 920px) {
      .score-grid,
      .summary-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .floating-topbar {
        min-height: 72px;
        padding: 10px 12px;
      }

      .menu-btn,
      .factory-logo {
        width: 44px;
        height: 44px;
      }

      .factory-info strong {
        font-size: 15px;
      }

      .factory-info span {
        font-size: 12px;
      }

      .top-user-box {
        max-width: 130px;
      }

      .user-info span {
        display: none;
      }

      .language-toggle {
        min-width: 36px;
        font-size: 14px;
      }

      .main {
        padding: 94px 14px 24px;
      }

      .panel {
        padding: 16px;
        border-radius: 24px;
      }

      .page-title h1 {
        font-size: 26px;
      }

      .form-grid,
      .score-grid,
      .summary-row {
        grid-template-columns: 1fr;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }

      .message {
        top: 82px;
      }
    }

    @media (max-width: 430px) {
      .factory-info span {
        display: none;
      }

      .topbar-side {
        gap: 9px;
      }

      .factory-brand {
        gap: 9px;
      }

      .page-title h1 {
        font-size: 24px;
      }

      .user-dropdown {
        width: 220px;
      }
    }
  </style>
</head>

<body>
  <header class="floating-topbar">
    <div class="topbar-side">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="فتح القائمة">☰</button>

      <div class="factory-brand">
        <div class="factory-logo">
          <img src="assets/img/logo.png" alt="NATAC Logo">
        </div>
        <div class="factory-info">
          <strong id="factoryName">ناتاك</strong>
          <span id="factorySubtitle">نظام متابعة الإنتاج اليومي</span>
        </div>
      </div>
    </div>

    <div class="topbar-side">
      <button id="languageToggleBtn" class="language-toggle" type="button">EN</button>

      <div class="user-menu-wrapper">
        <button class="top-user-box" id="topUserMenuBtn" type="button">
          <div class="avatar" id="userAvatar">U</div>
          <div class="user-info">
            <strong id="userName">مستخدم</strong>
            <span id="userRole">---</span>
          </div>
        </button>

        <div class="user-dropdown" id="userDropdown">
          <a href="profile.html">
            <span>👤</span>
            <span data-i18n="profile">الملف الشخصي</span>
          </a>

          <a href="users.html" data-permission="usersPage">
            <span>👥</span>
            <span data-i18n="usersManagement">إدارة المستخدمين</span>
          </a>

          <button type="button" id="logoutDropdownBtn">
            <span>🚪</span>
            <span data-i18n="logout">تسجيل الخروج</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">
        <div class="sidebar-logo">
          <img src="assets/img/logo.png" alt="NATAC Logo">
        </div>
        <div>
          <strong data-i18n="mainMenu">القائمة الرئيسية</strong>
          <span data-i18n="productionSystem">نظام الإنتاج</span>
        </div>
      </div>

      <button class="close-sidebar" id="closeSidebarBtn" type="button" aria-label="إغلاق القائمة">×</button>
    </div>

    <nav class="nav">
      <a href="dashboard.html">
        <span data-i18n="dashboard">لوحة التحكم</span>
        <span class="nav-icon">📊</span>
      </a>

      <a href="production.html" data-permission="productionEntry">
        <span data-i18n="productionEntry">إدخال الإنتاج</span>
        <span class="nav-icon">🏭</span>
      </a>

      <a href="evaluation.html" class="active" data-permission="supervisorEvaluation">
        <span data-i18n="supervisorEvaluation">تقييم المشرف</span>
        <span class="nav-icon">⭐</span>
      </a>

      <a href="history.html" data-permission="productionHistory">
        <span data-i18n="productionHistory">سجل الإنتاج</span>
        <span class="nav-icon">📋</span>
      </a>

      <a href="performance.html" data-permission="workerPerformance">
        <span data-i18n="workerPerformance">متابعة أداء العمال</span>
        <span class="nav-icon">📈</span>
      </a>

      <a href="workers.html" data-permission="workersPage">
        <span data-i18n="workers">العمال</span>
        <span class="nav-icon">👷</span>
      </a>

      <a href="products.html" data-permission="productsPage">
        <span data-i18n="products">المنتجات</span>
        <span class="nav-icon">📦</span>
      </a>

      <a href="machines.html" data-permission="machinesPage">
        <span data-i18n="machines">المكائن</span>
        <span class="nav-icon">⚙️</span>
      </a>
    </nav>
  </aside>

  <main class="main">
    <div id="loadingBox" class="loading">
      <span class="spinner"></span>
      <span data-i18n="loadingWorkers">جاري تحميل العمال...</span>
    </div>

    <div id="messageBox" class="message"></div>

    <section class="panel">
      <div class="panel-content">
        <div class="page-title">
          <div>
            <h1 data-i18n="supervisorEvaluation">تقييم المشرف</h1>
          </div>
        </div>

        <form id="evaluationForm" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="dateInput" data-i18n="date">التاريخ</label>
              <input type="date" id="dateInput">

            <div class="field">
              <label for="workerInput" data-i18n="workerName">اسم العامل</label>

              </select>

          <div class="score-grid">
            <div class="score-card">
              <label for="qualityInput" data-i18n="quality">الجودة</label>

            </div>

            <div class="score-card">
              <label for="cleanlinessInput" data-i18n="cleanliness">النظافة</label>
              <select id="cleanlinessInput" class="score-input"></select>
            </div>

            <div class="score-card">
              <label for="attendanceInput" data-i18n="attendance">الالتزام بالحضور والانضباط</label>
              <select id="attendanceInput" class="score-input"></select>
            </div>

            <div class="score-card">
              <label for="cooperationInput" data-i18n="cooperation">التعاون والسلوك</label>
              <select id="cooperationInput" class="score-input"></select>
            </div>

            <div class="score-card">
              <label for="problemSolvingInput" data-i18n="problemSolving">حل المشكلات</label>
              <select id="problemSolvingInput" class="score-input"></select>
            </div>

            <div class="score-card">
              <label for="innovationInput" data-i18n="innovation">الابتكار</label>

            <div class="summary-card">
              <span data-i18n="totalScore">مجموع الدرجات</span>

            <div class="summary-card">
              <span data-i18n="averageScore">متوسط التقييم</span>
              <strong id="averageScoreValue">0</strong>

            <div class="summary-card">
              <span data-i18n="evaluationLevel">مستوى التقييم</span>
              <div id="levelValue" class="level-pill level-weak">---</div>

          <div class="actions">
            <button class="btn btn-primary" type="submit" id="saveEvaluationBtn" data-i18n="saveEvaluation">حفظ التقييم</button>
            <button class="btn btn-secondary" type="button" id="clearFormBtn" data-i18n="clearForm">تفريغ النموذج</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyqTi-fYEKbC2l_GY0LHk8AFsKhxJgFBCc7ryThqzq6r3QAHTn9liQS3bXMbDDWygvd/exec?";
    const SESSION_KEY = "factoryUserSession";
    const LANGUAGE_KEY = "factoryLanguage";
    const INITIAL_CACHE_KEY = "evaluation_initial_data_v2";

    const i18n = {
      ar: {
        htmlLang: "ar",
        dir: "rtl",
        languageButton: "EN",
        pageTitle: "تقييم المشرف | ناتاك",
        factoryName: "ناتاك",
        factorySubtitle: "نظام متابعة الإنتاج اليومي",
        mainMenu: "القائمة الرئيسية",
        productionSystem: "نظام الإنتاج",
        dashboard: "لوحة التحكم",
        productionEntry: "إدخال الإنتاج",
        supervisorEvaluation: "تقييم المشرف",
        productionHistory: "سجل الإنتاج",
        workerPerformance: "متابعة أداء العمال",
        workers: "العمال",
        products: "المنتجات",
        machines: "المكائن",
        usersManagement: "إدارة المستخدمين",
        profile: "الملف الشخصي",
        logout: "تسجيل الخروج",
        loadingWorkers: "جاري تحميل العمال...",
        date: "التاريخ",
        workerName: "اسم العامل",
        chooseWorker: "اختر العامل",
        chooseScore: "اختر الدرجة",
        quality: "الجودة",
        cleanliness: "النظافة",
        attendance: "الالتزام بالحضور والانضباط",
        cooperation: "التعاون والسلوك",
        problemSolving: "حل المشكلات",
        innovation: "الابتكار",
        totalScore: "مجموع الدرجات",
        averageScore: "متوسط التقييم",
        evaluationLevel: "مستوى التقييم",
        excellent: "ممتاز",
        good: "جيد",
        average: "متوسط",
        weak: "ضعيف",
        saveEvaluation: "حفظ التقييم",
        clearForm: "تفريغ النموذج",
        roleAdmin: "مدير النظام",
        roleSupervisor: "مشرف",
        tokenMissing: "لم يتم العثور على رمز الجلسة token.",
        sessionExpired: "انتهت الجلسة، يرجى تسجيل الدخول مرة أخرى.",
        notAllowed: "ليس لديك صلاحية لدخول صفحة تقييم المشرف.",
        serverError: "تعذر الاتصال بالخادم. تحقق من رابط Apps Script أو اتصال الإنترنت.",
        loadFailed: "تعذر تحميل قائمة العمال.",
        dateRequired: "يرجى اختيار التاريخ.",
        futureDateNotAllowed: "لا يمكن اختيار تاريخ مستقبلي.",
        workerRequired: "يرجى اختيار العامل.",
        scoresRequired: "يرجى إدخال جميع درجات التقييم من 1 إلى 10.",
        saveSuccess: "تم حفظ تقييم المشرف بنجاح.",
        saving: "جاري الحفظ..."
      },
      en: {
        htmlLang: "en",
        dir: "ltr",
        languageButton: "عربي",
        pageTitle: "Supervisor Evaluation | NATAC",
        factoryName: "NATAC",
        factorySubtitle: "Daily Production Monitoring System",
        mainMenu: "Main Menu",
        productionSystem: "Production System",
        dashboard: "Dashboard",
        productionEntry: "Production Entry",
        supervisorEvaluation: "Supervisor Evaluation",
        productionHistory: "Production History",
        workerPerformance: "Worker Performance",
        workers: "Workers",
        products: "Products",
        machines: "Machines",
        usersManagement: "Users Management",
        profile: "Profile",
        logout: "Logout",
        loadingWorkers: "Loading workers...",
        date: "Date",
        workerName: "Worker Name",
        chooseWorker: "Choose Worker",
        chooseScore: "Choose Score",
        quality: "Quality",
        cleanliness: "Cleanliness",
        attendance: "Attendance & Discipline",
        cooperation: "Cooperation & Behavior",
        problemSolving: "Problem Solving",
        innovation: "Innovation",
        totalScore: "Total Score",
        averageScore: "Average Score",
        evaluationLevel: "Evaluation Level",
        excellent: "Excellent",
        good: "Good",
        average: "Average",
        weak: "Weak",
        saveEvaluation: "Save Evaluation",
        clearForm: "Clear Form",
        roleAdmin: "System Admin",
        roleSupervisor: "Supervisor",
        tokenMissing: "Session token not found.",
        sessionExpired: "Session expired. Please login again.",
        notAllowed: "You do not have permission to access Supervisor Evaluation.",
        serverError: "Unable to connect to the server. Check Apps Script URL or internet connection.",
        loadFailed: "Unable to load workers list.",
        dateRequired: "Please choose date.",
        futureDateNotAllowed: "Future date is not allowed.",
        workerRequired: "Please choose worker.",
        scoresRequired: "Please enter all evaluation scores from 1 to 10.",
        saveSuccess: "Supervisor evaluation saved successfully.",
        saving: "Saving..."
      }
    };

    let currentLang = localStorage.getItem(LANGUAGE_KEY) || "ar";
    let currentUser = null;
    let workers = [];
    let messageTimer = null;

    const loadingBox = document.getElementById("loadingBox");
    const messageBox = document.getElementById("messageBox");

    const factoryName = document.getElementById("factoryName");
    const factorySubtitle = document.getElementById("factorySubtitle");

    const userName = document.getElementById("userName");
    const userRole = document.getElementById("userRole");
    const userAvatar = document.getElementById("userAvatar");

    const topUserMenuBtn = document.getElementById("topUserMenuBtn");
    const userDropdown = document.getElementById("userDropdown");
    const logoutDropdownBtn = document.getElementById("logoutDropdownBtn");
    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const languageToggleBtn = document.getElementById("languageToggleBtn");

    const evaluationForm = document.getElementById("evaluationForm");
    const dateInput = document.getElementById("dateInput");
    const workerInput = document.getElementById("workerInput");

    const qualityInput = document.getElementById("qualityInput");
    const cleanlinessInput = document.getElementById("cleanlinessInput");
    const attendanceInput = document.getElementById("attendanceInput");
    const cooperationInput = document.getElementById("cooperationInput");
    const problemSolvingInput = document.getElementById("problemSolvingInput");
    const innovationInput = document.getElementById("innovationInput");

    const scoreInputs = [
      qualityInput,
      cleanlinessInput,
      attendanceInput,
      cooperationInput,
      problemSolvingInput,
      innovationInput
    ];

    const totalScoreValue = document.getElementById("totalScoreValue");
    const averageScoreValue = document.getElementById("averageScoreValue");
    const levelValue = document.getElementById("levelValue");

    const saveEvaluationBtn = document.getElementById("saveEvaluationBtn");
    const clearFormBtn = document.getElementById("clearFormBtn");

    document.addEventListener("DOMContentLoaded", () => {
      applyLanguage(currentLang);
      initSidebar();
      initLanguage();
      initUserDropdown();
      initScores();
      bindEvents();
      setTodayDate();
      protectPageAndLoadData();
    });

    function t(key) {
      return i18n[currentLang][key];
    }

    function normalizeSession(session) {
      const user = session.user || session.User || {};

      return {
        ...user,
        token: session.token || user.token || "",
        UserID: user.UserID || session.UserID || "",
        FullName: user.FullName || user.fullName || session.FullName || session.fullName || user.name || session.name || user.Username || user.username || "",
        Username: user.Username || user.username || session.Username || session.username || "",
        Role: user.Role || user.role || session.Role || session.role || "",
        Status: user.Status || user.status || session.Status || session.status || "",
        Permissions: user.Permissions || user.permissions || session.Permissions || session.permissions || {}
      };
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANGUAGE_KEY, lang);

      document.documentElement.lang = i18n[lang].htmlLang;
      document.documentElement.dir = i18n[lang].dir;
      document.title = i18n[lang].pageTitle;

      factoryName.textContent = i18n[lang].factoryName;
      factorySubtitle.textContent = i18n[lang].factorySubtitle;
      languageToggleBtn.textContent = i18n[lang].languageButton;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (i18n[lang][key]) {
          el.textContent = i18n[lang][key];
        }
      });

      const session = getSession();

      if (session) {
        currentUser = normalizeSession(session);
        renderUser(currentUser);
        applyPermissionsUI();
      }

      initScores();
      renderWorkersOptions();
      updateScoreSummary();
    }

    async function protectPageAndLoadData() {
      const session = getSession();

      if (!session || !session.token) {
        redirectToLogin();
        return;
      }

      try {
        const sessionResult = await apiPost({
          action: "checkSession",
          token: session.token
        });

        if (!sessionResult || !sessionResult.success) {
          localStorage.removeItem(SESSION_KEY);
          showMessage((sessionResult && sessionResult.message) || t("sessionExpired"), "error");

          setTimeout(() => {
            redirectToLogin();
          }, 800);

          return;
        }

        currentUser = normalizeSession({
          ...session,
          user: sessionResult.user
        });

        localStorage.setItem(SESSION_KEY, JSON.stringify({
          token: session.token,
          user: currentUser
        }));

        renderUser(currentUser);
        applyPermissionsUI();

        if (!hasClientPermission("supervisorEvaluation")) {
          hideLoading();
          showMessage(t("notAllowed"), "error");

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);

          return;
        }

        await loadInitialData();

      } catch (error) {
        console.error(error);
        hideLoading();
        showMessage(t("serverError"), "error");
      }
    }

    function renderUser(session) {
      const name =
        session.FullName ||
        session.fullName ||
        session.name ||
        session.Username ||
        session.username ||
        "User";

      const role = session.Role || session.role || "---";

      userName.textContent = name;
      userRole.textContent = normalizeRoleLabel(role);

      const firstLetter = String(name).trim().charAt(0) || "U";
      userAvatar.textContent = firstLetter;
    }

    function normalizeRoleLabel(role) {
      const cleanRole = String(role || "").toLowerCase();

      if (cleanRole === "admin") return t("roleAdmin");
      if (cleanRole === "supervisor") return t("roleSupervisor");

      return role || "---";
    }

    function hasClientPermission(permissionKey) {
      const role = String(currentUser?.Role || currentUser?.role || "").toLowerCase();

      if (role === "admin") return true;

      const permissions = currentUser?.Permissions || currentUser?.permissions || {};

      return permissions[permissionKey] === true;
    }

    function applyPermissionsUI() {
      document.querySelectorAll("[data-permission]").forEach(element => {
        const permissionKey = element.getAttribute("data-permission");
        element.style.display = hasClientPermission(permissionKey) ? "" : "none";
      });
    }

    function isAdmin() {
      return String(currentUser?.Role || currentUser?.role || "").toLowerCase() === "admin";
    }

    function setTodayDate() {
      const today = toISODate(new Date());
      dateInput.value = today;
      dateInput.max = today;
    }

    function initScores() {
      scoreInputs.forEach(input => {
        const currentValue = input.value || "";

        input.innerHTML = `<option value="">${t("chooseScore")}</option>`;

        for (let i = 1; i <= 10; i++) {
          const option = document.createElement("option");
          option.value = String(i);
          option.textContent = String(i);
          input.appendChild(option);
        }

        if (currentValue) {
          input.value = currentValue;
        }
      });
    }

    async function loadInitialData() {
      if (!currentUser || !currentUser.token) {
        hideLoading();
        showMessage(t("tokenMissing"), "error");
        return;
      }

      const cached = getLocalCache_(INITIAL_CACHE_KEY, 300000);

      if (cached) {
        workers = cached.workers || [];
        renderWorkersOptions();
        hideLoading();
      }

      try {
        const result = await apiPost({
          action: "getInitialData",
          token: currentUser.token
        });

        if (!result || !result.success) {
          if (!cached) {
            hideLoading();
            showMessage((result && result.message) || t("loadFailed"), "error");
          }
          return;
        }

        workers = result.workers || [];
        setLocalCache_(INITIAL_CACHE_KEY, {
          workers: workers
        });

        renderWorkersOptions();
        hideLoading();

      } catch (error) {
        console.error(error);

        if (!cached) {
          hideLoading();
          showMessage(t("serverError"), "error");
        }
      }
    }

    function renderWorkersOptions() {
      const currentValue = workerInput.value || "";

      workerInput.innerHTML = `<option value="">${t("chooseWorker")}</option>`;

      workers.forEach(worker => {
        const option = document.createElement("option");
        option.value = worker.WorkerID || "";
        option.textContent = worker.WorkerName || worker.WorkerID || "";
        workerInput.appendChild(option);
      });

      if ([...workerInput.options].some(option => option.value === currentValue)) {
        workerInput.value = currentValue;
      }
    }

    function bindEvents() {
      evaluationForm.addEventListener("submit", handleSaveEvaluation);
      clearFormBtn.addEventListener("click", clearForm);

      scoreInputs.forEach(input => {
        input.addEventListener("change", updateScoreSummary);
      });

      dateInput.addEventListener("change", () => {
        if (dateInput.value > toISODate(new Date())) {
          showMessage(t("futureDateNotAllowed"), "error");
          setTodayDate();
        }
      });

      logoutDropdownBtn.addEventListener("click", logoutUser);
    }

    async function handleSaveEvaluation(event) {
      event.preventDefault();
      clearMessage();

      const date = dateInput.value || "";
      const workerId = workerInput.value || "";

      if (!date) {
        showMessage(t("dateRequired"), "error");
        return;
      }

      if (date > toISODate(new Date())) {
        showMessage(t("futureDateNotAllowed"), "error");
        return;
      }

      if (!workerId) {
        showMessage(t("workerRequired"), "error");
        return;
      }

      const scores = getScores();

      if (scores.some(score => score < 1 || score > 10)) {
        showMessage(t("scoresRequired"), "error");
        return;
      }

      setButtonLoading(saveEvaluationBtn, true, t("saving"));

      try {
        const result = await apiPost({
          action: "saveSupervisorEvaluation",
          token: currentUser.token,
          evaluation: {
            date: date,
            workerId: workerId,
            quality: scores[0],
            cleanliness: scores[1],
            attendance: scores[2],
            cooperation: scores[3],
            problemSolving: scores[4],
            innovation: scores[5]
          }
        });

        setButtonLoading(saveEvaluationBtn, false, t("saveEvaluation"));

        if (!result || !result.success) {
          showMessage((result && result.message) || t("serverError"), "error");
          return;
        }

        clearPageLocalCache_("dashboard_cache");
        clearPageLocalCache_("performance_");
        clearPageLocalCache_("history_cache");

        showMessage(result.message || t("saveSuccess"), "success");
        clearForm(false);

      } catch (error) {
        console.error(error);
        setButtonLoading(saveEvaluationBtn, false, t("saveEvaluation"));
        showMessage(t("serverError"), "error");
      }
    }

    function getScores() {
      return scoreInputs.map(input => Number(input.value || 0));
    }

    function updateScoreSummary() {
      const scores = getScores();
      const validScores = scores.filter(score => score >= 1 && score <= 10);
      const total = validScores.reduce((sum, score) => sum + score, 0);
      const average = validScores.length ? total / validScores.length : 0;

      totalScoreValue.textContent = formatNumber(total);
      averageScoreValue.textContent = formatDecimal(average);

      renderLevel(average, validScores.length === 6);
    }

    function renderLevel(average, completed) {
      levelValue.className = "level-pill";

      if (!completed) {
        levelValue.textContent = "---";
        levelValue.classList.add("level-weak");
        return;
      }

      if (average >= 9) {
        levelValue.textContent = t("excellent");
        levelValue.classList.add("level-excellent");
        return;
      }

      if (average >= 7) {
        levelValue.textContent = t("good");
        levelValue.classList.add("level-good");
        return;
      }

      if (average >= 5) {
        levelValue.textContent = t("average");
        levelValue.classList.add("level-average");
        return;
      }

      levelValue.textContent = t("weak");
      levelValue.classList.add("level-weak");
    }

    function clearForm(resetDate = true) {
      evaluationForm.reset();

      if (resetDate) {
        setTodayDate();
      } else {
        dateInput.value = toISODate(new Date());
      }

      initScores();
      updateScoreSummary();
    }

    async function apiPost(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return await response.json();
    }

    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (error) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }

    function getLocalCache_(key, maxAgeMs) {
      try {
        const raw = localStorage.getItem(key);

        if (!raw) return null;

        const cached = JSON.parse(raw);

        if (!cached || !cached.savedAt || !cached.data) {
          localStorage.removeItem(key);
          return null;
        }

        const age = Date.now() - cached.savedAt;

        if (age > maxAgeMs) {
          localStorage.removeItem(key);
          return null;
        }

        return cached.data;

      } catch (error) {
        localStorage.removeItem(key);
        return null;
      }
    }

    function setLocalCache_(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify({
          savedAt: Date.now(),
          data: data
        }));
      } catch (error) {
        console.warn("Local cache failed:", error);
      }
    }

    function clearPageLocalCache_(prefix) {
      Object.keys(localStorage).forEach(function(key) {
        if (key.indexOf(prefix) === 0) {
          localStorage.removeItem(key);
        }
      });
    }

    function redirectToLogin() {
      window.location.href = "index.html";
    }

    function initSidebar() {
      menuBtn.addEventListener("click", openSidebar);
      closeSidebarBtn.addEventListener("click", closeSidebar);
      overlay.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeSidebar();
          closeUserDropdown();
        }
      });

      document.querySelectorAll(".nav a").forEach(link => {
        link.addEventListener("click", closeSidebar);
      });
    }

    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
      document.body.style.overflow = "";
    }

    function initLanguage() {
      languageToggleBtn.addEventListener("click", () => {
        const nextLang = currentLang === "ar" ? "en" : "ar";
        applyLanguage(nextLang);
      });
    }

    function initUserDropdown() {
      topUserMenuBtn.addEventListener("click", event => {
        event.stopPropagation();
        userDropdown.classList.toggle("show");
      });

      userDropdown.addEventListener("click", event => {
        event.stopPropagation();
      });

      document.addEventListener("click", event => {
        if (!event.target.closest(".user-menu-wrapper")) {
          closeUserDropdown();
        }
      });
    }

    function closeUserDropdown() {
      userDropdown.classList.remove("show");
    }

    async function logoutUser() {
      const session = getSession();

      try {
        if (session && session.token && API_URL) {
          await apiPost({
            action: "logout",
            token: session.token
          });
        }
      } catch (error) {
        console.warn(error);
      }

      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(INITIAL_CACHE_KEY);
      redirectToLogin();
    }

    function hideLoading() {
      loadingBox.style.display = "none";
    }

    function setButtonLoading(button, isLoading, text) {
      button.disabled = isLoading;

      if (isLoading) {
        button.innerHTML = '<span class="mini-spinner"></span>' + text;
      } else {
        button.textContent = text;
      }
    }

    function showMessage(text, type) {
      clearTimeout(messageTimer);

      messageBox.textContent = text;
      messageBox.className = "message " + type;

      messageTimer = setTimeout(() => {
        clearMessage();
      }, 3000);
    }

    function clearMessage() {
      clearTimeout(messageTimer);
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function formatNumber(value) {
      const number = Number(value || 0);

      return number.toLocaleString("en-US", {
        maximumFractionDigits: 0
      });
    }

    function formatDecimal(value) {
      const number = Number(value || 0);

      return number.toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function toISODate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }
  </script>
</body>
</html>
