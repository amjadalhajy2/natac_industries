<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>العمال | NATAC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #eaf1ff;
      --bg-2: #f7f1ea;
      --text: #101827;
      --muted: #667085;
      --line: rgba(16, 24, 39, 0.12);
      --card: rgba(255, 255, 255, 0.88);
      --input: rgba(255, 255, 255, 0.98);
      --blue: #0066ff;
      --blue-dark: #004ec2;
      --purple: #6d28d9;
      --red: #dc2626;
      --shadow: 0 22px 60px rgba(16, 24, 39, 0.14);
      --topbar-height: 78px;
      --sidebar-width: 310px;
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 12%, rgba(0, 102, 255, 0.28), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(109, 40, 217, 0.20), transparent 30%),
        linear-gradient(135deg, var(--bg-1), #ffffff 52%, var(--bg-2));
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .floating-topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      min-height: var(--topbar-height);
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(16, 24, 39, 0.10);
      box-shadow: 0 12px 32px rgba(16, 24, 39, 0.10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 22px;
    }

    .topbar-side {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .menu-btn,
    .language-toggle {
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      font-size: 30px;
      display: grid;
      place-items: center;
    }

    .language-toggle {
      min-width: 44px;
      height: 42px;
      font-size: 16px;
    }

    .factory-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .factory-logo,
    .sidebar-logo {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(16,24,39,0.08);
      flex-shrink: 0;
    }

    .factory-logo {
      width: 50px;
      height: 50px;
      border-radius: 18px;
    }

    .sidebar-logo {
      width: 49px;
      height: 49px;
      border-radius: 18px;
    }

    .factory-logo img,
    .sidebar-logo img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    .factory-info,
    .user-info,
    .sidebar-title {
      min-width: 0;
      text-align: start;
    }

    .factory-info strong {
      display: block;
      font-size: 19px;
      font-weight: 900;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .factory-info span {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-user-box {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--blue), var(--purple));
      color: #fff;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(0,102,255,0.20);
    }

    .user-info strong,
    .user-info span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-info strong {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
    }

    .user-info span {
      margin-top: 1px;
      font-size: 12px;
      color: var(--muted);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(16, 24, 39, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay.show {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      max-width: 88vw;
      height: 100vh;
      z-index: 200;
      padding: 22px 18px;
      overflow-y: auto;
      transform: translateX(105%);
      transition: transform 0.26s cubic-bezier(.2,.8,.2,1);
      background: rgba(255,255,255,0.94);
      border-left: 1px solid rgba(16,24,39,0.10);
      box-shadow: -28px 0 70px rgba(16, 24, 39, 0.18);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    html[dir="ltr"] .sidebar {
      right: auto;
      left: 0;
      transform: translateX(-105%);
      border-left: 0;
      border-right: 1px solid rgba(16,24,39,0.10);
      box-shadow: 28px 0 70px rgba(16, 24, 39, 0.18);
    }

    .sidebar.open,
    html[dir="ltr"] .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .sidebar-title strong {
      display: block;
      font-size: 16px;
      font-weight: 900;
    }

    .sidebar-title span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .close-sidebar {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 14px;
      background: rgba(220, 38, 38, 0.08);
      color: var(--red);
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav {
      display: grid;
    }

    .nav a,
    .logout-btn {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      padding: 13px 4px;
      border: 0;
      border-bottom: 1px solid rgba(16,24,39,0.10);
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      text-align: start;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .nav a:hover,
    .logout-btn:hover {
      color: var(--blue-dark);
      padding-inline-start: 10px;
    }

    .nav a.active {
      color: var(--blue-dark);
    }

    .nav-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .main {
      width: 100%;
      max-width: 1450px;
      margin: 0 auto;
      padding: 116px 24px 32px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 22px;
      border-radius: var(--radius-xl);
      background: var(--card);
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
    }

    .panel-content {
      position: relative;
      z-index: 1;
    }

    .page-title {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(16,24,39,0.10);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      text-align: start;
    }

    .page-title h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(145deg, #0066ff, #5b21b6);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 102, 255, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(0, 102, 255, 0.27);
    }

    .btn-secondary {
      background: #fff;
      color: var(--blue-dark);
      border: 1px solid rgba(0, 102, 255, 0.28);
      box-shadow: 0 8px 20px rgba(16,24,39,0.06);
    }

    .btn-small {
      min-height: 38px;
      border-radius: 12px;
      padding: 0 13px;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .filters-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 12px;
      margin-bottom: 16px;
      align-items: end;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding-inline-start: 48px;
    }

    .search-icon {
      position: absolute;
      inset-inline-start: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--muted);
      pointer-events: none;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
      text-align: start;
    }

    label {
      font-weight: 900;
      color: var(--text);
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(16,24,39,0.18);
      border-radius: 16px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 15px;
      background: var(--input);
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 0 rgba(16,24,39,0.03);
      transition: 0.18s ease;
    }

    input::placeholder {
      color: #98a2b3;
    }

    input:focus,
    select:focus {
      border-color: rgba(0, 102, 255, 0.65);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.13);
      background: #fff;
    }

    .table-wrap {
      border-radius: 18px;
      overflow-x: auto;
      border: 1px solid rgba(16,24,39,0.16);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #fff;
    }

    th,
    td {
      border: 1px solid rgba(16,24,39,0.12);
      padding: 12px;
      text-align: start;
      vertical-align: middle;
      font-weight: 800;
    }

    th {
      background: #eef4ff;
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
    }

    td {
      background: #fff;
      color: var(--text);
    }

    .id-cell {
      direction: ltr;
      text-align: start;
      font-family: Arial, sans-serif;
      font-weight: 900;
      color: var(--blue-dark);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-active {
      background: rgba(22, 163, 74, 0.10);
      color: #166534;
      border: 1px solid rgba(22, 163, 74, 0.18);
    }

    .status-inactive {
      background: rgba(220, 38, 38, 0.08);
      color: #991b1b;
      border: 1px solid rgba(220, 38, 38, 0.18);
    }

    .table-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .empty-state {
      padding: 18px;
      border-radius: 18px;
      background: #f9fafb;
      color: var(--muted);
      font-weight: 900;
      text-align: center;
      border: 1px dashed rgba(16,24,39,0.16);
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 900;
      margin-bottom: 16px;
      padding: 13px 15px;
      width: fit-content;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: 0 8px 22px rgba(16,24,39,0.07);
    }

    .spinner,
    .mini-spinner {
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 102, 255, 0.14);
      border-top-color: var(--blue);
    }

    .mini-spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.45);
      border-top-color: #fff;
      display: inline-block;
    }

    .message {
      display: none;
      position: fixed;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      min-width: min(520px, calc(100vw - 28px));
      max-width: calc(100vw - 28px);
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.7;
      border: 1px solid transparent;
      box-shadow: 0 18px 48px rgba(16, 24, 39, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: rgba(254, 242, 242, 0.98);
      border-color: #fecaca;
    }

    .message.success {
      display: block;
      color: #166534;
      background: rgba(240, 253, 244, 0.98);
      border-color: #bbf7d0;
    }

    .message.warning {
      display: block;
      color: #9a3412;
      background: rgba(255, 247, 237, 0.98);
      border-color: #fed7aa;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 600;
      background: rgba(16, 24, 39, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 16px;
      place-items: center;
    }

    .modal-overlay.show {
      display: grid;
    }

    .modal-card {
      width: min(520px, 100%);
      border-radius: 28px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: 0 28px 70px rgba(16,24,39,0.22);
      padding: 22px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(16,24,39,0.10);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
    }

    .close-modal {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: rgba(220, 38, 38, 0.08);
      color: var(--red);
      font-size: 24px;
      cursor: pointer;
    }

    .modal-form {
      display: grid;
      gap: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 760px) {
      .floating-topbar {
        min-height: 72px;
        padding: 10px 12px;
      }

      .menu-btn,
      .factory-logo {
        width: 44px;
        height: 44px;
      }

      .factory-info strong {
        font-size: 15px;
      }

      .factory-info span {
        font-size: 12px;
      }

      .top-user-box {
        max-width: 130px;
      }

      .user-info span {
        display: none;
      }

      .language-toggle {
        min-width: 36px;
        font-size: 14px;
      }

      .main {
        padding: 94px 14px 24px;
      }

      .panel {
        padding: 16px;
        border-radius: 24px;
      }

      .page-title h1 {
        font-size: 26px;
      }

      .filters-row {
        grid-template-columns: 1fr;
      }

      .actions,
      .table-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }

      .message {
        top: 82px;
      }
    }

    @media (max-width: 430px) {
      .factory-info span {
        display: none;
      }

      .topbar-side {
        gap: 9px;
      }

      .factory-brand {
        gap: 9px;
      }

      .page-title h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <header class="floating-topbar">
    <div class="topbar-side">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="فتح القائمة">☰</button>

      <div class="factory-brand">
        <div class="factory-logo">
          <img src="assets/img/logo.png" alt="NATAC Logo">
        </div>
        <div class="factory-info">
          <strong id="factoryName">ناتاك</strong>
          <span id="factorySubtitle">نظام متابعة الإنتاج اليومي</span>
        </div>
      </div>
    </div>

    <div class="topbar-side">
      <button id="languageToggleBtn" class="language-toggle" type="button">EN</button>

      <div class="top-user-box">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <strong id="userName">مستخدم</strong>
          <span id="userRole">---</span>
        </div>
      </div>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">
        <div class="sidebar-logo">
          <img src="assets/img/logo.png" alt="NATAC Logo">
        </div>
        <div>
          <strong data-i18n="mainMenu">القائمة الرئيسية</strong>
          <span data-i18n="productionSystem">نظام الإنتاج</span>
        </div>
      </div>

      <button class="close-sidebar" id="closeSidebarBtn" type="button" aria-label="إغلاق القائمة">×</button>
    </div>

    <nav class="nav">
      <a href="dashboard.html">
        <span data-i18n="dashboard">لوحة التحكم</span>
        <span class="nav-icon">📊</span>
      </a>

      <a href="production.html">
        <span data-i18n="productionEntry">إدخال الإنتاج</span>
        <span class="nav-icon">🏭</span>
      </a>

      <a href="evaluation.html">
        <span data-i18n="supervisorEvaluation">تقييم المشرف</span>
        <span class="nav-icon">⭐</span>
      </a>

      <a href="history.html">
        <span data-i18n="productionHistory">سجل الإنتاج</span>
        <span class="nav-icon">📋</span>
      </a>

      <a href="workers.html" class="active">
        <span data-i18n="workers">العمال</span>
        <span class="nav-icon">👷</span>
      </a>

      <a href="products.html" class="admin-only">
        <span data-i18n="products">المنتجات</span>
        <span class="nav-icon">📦</span>
      </a>

      <a href="machines.html" class="admin-only">
        <span data-i18n="machines">المكائن</span>
        <span class="nav-icon">⚙️</span>
      </a>

      <button class="logout-btn" type="button" id="logoutBtn">
        <span data-i18n="logout">تسجيل الخروج</span>
        <span class="nav-icon">🚪</span>
      </button>
    </nav>
  </aside>

  <main class="main">
    <div id="loadingBox" class="loading">
      <span class="spinner"></span>
      <span data-i18n="loadingWorkers">جاري تحميل العمال...</span>
    </div>

    <div id="messageBox" class="message"></div>

    <section class="panel">
      <div class="panel-content">
        <div class="page-title">
          <div>
            <h1 data-i18n="workers">العمال</h1>
          </div>

          <div class="actions admin-only">
            <button class="btn btn-primary" type="button" id="openAddWorkerBtn">
              <span>＋</span>
              <span data-i18n="addWorker">إضافة عامل</span>
            </button>
          </div>
        </div>

        <div class="filters-row">
          <div class="search-box">
            <span class="search-icon">🔎</span>
            <input type="search" id="workersSearchInput" autocomplete="off" placeholder="بحث في قائمة العمال">
          </div>

          <div class="field">
            <select id="statusFilterInput">
              <option value="all" data-i18n="allStatuses">كل الحالات</option>
              <option value="Active" data-i18n="active">نشط</option>
              <option value="Inactive" data-i18n="inactive">غير نشط</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="workerId">رقم العامل</th>
                <th data-i18n="workerName">اسم العامل</th>
                <th data-i18n="status">الحالة</th>
                <th class="admin-only" data-i18n="actions">الإجراء</th>
              </tr>
            </thead>
            <tbody id="workersTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="addWorkerModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 data-i18n="addWorker">إضافة عامل</h2>
        <button class="close-modal" type="button" id="closeAddWorkerModalBtn">×</button>
      </div>

      <form id="workerForm" class="modal-form" novalidate>
        <div class="field">
          <label for="workerNameInput" data-i18n="workerName">اسم العامل</label>
          <input type="text" id="workerNameInput" autocomplete="off">
        </div>

        <div class="field">
          <label for="workerStatusInput" data-i18n="status">الحالة</label>
          <select id="workerStatusInput">
            <option value="Active" data-i18n="active">نشط</option>
            <option value="Inactive" data-i18n="inactive">غير نشط</option>
          </select>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit" id="saveWorkerBtn" data-i18n="save">حفظ</button>
          <button class="btn btn-secondary" type="button" id="cancelWorkerBtn" data-i18n="cancel">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 data-i18n="editWorker">تعديل عامل</h2>
        <button class="close-modal" type="button" id="closeEditModalBtn">×</button>
      </div>

      <form id="editWorkerForm" class="modal-form" novalidate>
        <input type="hidden" id="editWorkerId">

        <div class="field">
          <label for="editWorkerName" data-i18n="workerName">اسم العامل</label>
          <input type="text" id="editWorkerName" autocomplete="off">
        </div>

        <div class="field">
          <label for="editWorkerStatus" data-i18n="status">الحالة</label>
          <select id="editWorkerStatus">
            <option value="Active" data-i18n="active">نشط</option>
            <option value="Inactive" data-i18n="inactive">غير نشط</option>
          </select>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit" id="updateWorkerBtn" data-i18n="saveChanges">حفظ التعديل</button>
          <button class="btn btn-secondary" type="button" id="cancelEditWorkerBtn" data-i18n="cancel">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyqTi-fYEKbC2l_GY0LHk8AFsKhxJgFBCc7ryThqzq6r3QAHTn9liQS3bXMbDDWygvd/exec?";
    const SESSION_KEY = "factoryUserSession";
    const LANGUAGE_KEY = "factoryLanguage";

    const i18n = {
      ar: {
        htmlLang: "ar",
        dir: "rtl",
        languageButton: "EN",
        pageTitle: "العمال | ناتاك",
        factoryName: "ناتاك",
        factorySubtitle: "نظام متابعة الإنتاج اليومي",
        mainMenu: "القائمة الرئيسية",
        productionSystem: "نظام الإنتاج",
        dashboard: "لوحة التحكم",
        productionEntry: "إدخال الإنتاج",
        supervisorEvaluation: "تقييم المشرف",
        productionHistory: "سجل الإنتاج",
        workers: "العمال",
        products: "المنتجات",
        machines: "المكائن",
        logout: "تسجيل الخروج",
        loadingWorkers: "جاري تحميل العمال...",
        addWorker: "إضافة عامل",
        workerId: "رقم العامل",
        workerName: "اسم العامل",
        status: "الحالة",
        allStatuses: "كل الحالات",
        active: "نشط",
        inactive: "غير نشط",
        actions: "الإجراء",
        save: "حفظ",
        cancel: "إلغاء",
        edit: "تعديل",
        editWorker: "تعديل عامل",
        saveChanges: "حفظ التعديل",
        emptyData: "لا توجد بيانات للعرض.",
        roleAdmin: "مدير النظام",
        roleSupervisor: "مشرف",
        tokenMissing: "لم يتم العثور على رمز الجلسة token.",
        serverError: "تعذر الاتصال بالخادم. تحقق من رابط Apps Script أو اتصال الإنترنت.",
        loadFailed: "تعذر تحميل بيانات العمال.",
        nameRequired: "يرجى إدخال اسم العامل.",
        duplicateWorkerName: "لا يمكن إضافة عامل بنفس الاسم. هذا العامل موجود مسبقًا.",
        duplicateWorkerNameEdit: "لا يمكن حفظ التعديل لأن اسم العامل مستخدم مسبقًا لعامل آخر.",
        addSuccess: "تمت إضافة العامل بنجاح.",
        updateSuccess: "تم تحديث بيانات العامل بنجاح.",
        saving: "جاري الحفظ...",
        searchPlaceholder: "بحث في قائمة العمال"
      },
      en: {
        htmlLang: "en",
        dir: "ltr",
        languageButton: "عربي",
        pageTitle: "Workers | NATAC",
        factoryName: "NATAC",
        factorySubtitle: "Daily Production Monitoring System",
        mainMenu: "Main Menu",
        productionSystem: "Production System",
        dashboard: "Dashboard",
        productionEntry: "Production Entry",
        supervisorEvaluation: "Supervisor Evaluation",
        productionHistory: "Production History",
        workers: "Workers",
        products: "Products",
        machines: "Machines",
        logout: "Logout",
        loadingWorkers: "Loading workers...",
        addWorker: "Add Worker",
        workerId: "Worker ID",
        workerName: "Worker Name",
        status: "Status",
        allStatuses: "All Statuses",
        active: "Active",
        inactive: "Inactive",
        actions: "Action",
        save: "Save",
        cancel: "Cancel",
        edit: "Edit",
        editWorker: "Edit Worker",
        saveChanges: "Save Changes",
        emptyData: "No data to display.",
        roleAdmin: "System Admin",
        roleSupervisor: "Supervisor",
        tokenMissing: "Session token not found.",
        serverError: "Unable to connect to the server. Check Apps Script URL or internet connection.",
        loadFailed: "Unable to load workers data.",
        nameRequired: "Please enter worker name.",
        duplicateWorkerName: "A worker with the same name already exists.",
        duplicateWorkerNameEdit: "Cannot save changes because this name is already used by another worker.",
        addSuccess: "Worker added successfully.",
        updateSuccess: "Worker updated successfully.",
        saving: "Saving...",
        searchPlaceholder: "Search workers list"
      }
    };

    let currentLang = localStorage.getItem(LANGUAGE_KEY) || "ar";
    let currentUser = null;
    let workers = [];
    let messageTimer = null;

    const loadingBox = document.getElementById("loadingBox");
    const messageBox = document.getElementById("messageBox");

    const factoryName = document.getElementById("factoryName");
    const factorySubtitle = document.getElementById("factorySubtitle");

    const userName = document.getElementById("userName");
    const userRole = document.getElementById("userRole");
    const userAvatar = document.getElementById("userAvatar");

    const logoutBtn = document.getElementById("logoutBtn");
    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const languageToggleBtn = document.getElementById("languageToggleBtn");

    const openAddWorkerBtn = document.getElementById("openAddWorkerBtn");
    const addWorkerModal = document.getElementById("addWorkerModal");
    const closeAddWorkerModalBtn = document.getElementById("closeAddWorkerModalBtn");
    const workerForm = document.getElementById("workerForm");
    const workerNameInput = document.getElementById("workerNameInput");
    const workerStatusInput = document.getElementById("workerStatusInput");
    const saveWorkerBtn = document.getElementById("saveWorkerBtn");
    const cancelWorkerBtn = document.getElementById("cancelWorkerBtn");

    const workersSearchInput = document.getElementById("workersSearchInput");
    const statusFilterInput = document.getElementById("statusFilterInput");
    const workersTableBody = document.getElementById("workersTableBody");

    const editModal = document.getElementById("editModal");
    const closeEditModalBtn = document.getElementById("closeEditModalBtn");
    const cancelEditWorkerBtn = document.getElementById("cancelEditWorkerBtn");
    const editWorkerForm = document.getElementById("editWorkerForm");
    const editWorkerId = document.getElementById("editWorkerId");
    const editWorkerName = document.getElementById("editWorkerName");
    const editWorkerStatus = document.getElementById("editWorkerStatus");
    const updateWorkerBtn = document.getElementById("updateWorkerBtn");

    document.addEventListener("DOMContentLoaded", () => {
      applyLanguage(currentLang);
      protectPage();
      initSidebar();
      initLanguage();
      bindEvents();
      loadWorkers();
    });

    function t(key) {
      return i18n[currentLang][key];
    }

    function normalizeSession(session) {
      const user = session.user || session.User || {};
      return {
        ...user,
        ...session,
        token: session.token || user.token || "",
        Role: session.Role || session.role || user.Role || user.role || "",
        FullName: session.FullName || session.fullName || user.FullName || user.fullName || user.name || session.name || session.username || user.Username || user.username || "",
        Username: session.Username || session.username || user.Username || user.username || ""
      };
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANGUAGE_KEY, lang);

      document.documentElement.lang = i18n[lang].htmlLang;
      document.documentElement.dir = i18n[lang].dir;
      document.title = i18n[lang].pageTitle;

      factoryName.textContent = i18n[lang].factoryName;
      factorySubtitle.textContent = i18n[lang].factorySubtitle;
      languageToggleBtn.textContent = i18n[lang].languageButton;
      workersSearchInput.placeholder = i18n[lang].searchPlaceholder;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (i18n[lang][key]) {
          el.textContent = i18n[lang][key];
        }
      });

      const session = getSession();

      if (session) {
        currentUser = normalizeSession(session);
        renderUser(currentUser);
        applyRoleUI(currentUser.Role || currentUser.role);
      }

      renderWorkersTable();
    }

    function protectPage() {
      const session = getSession();

      if (!session) {
        window.location.href = "index.html";
        return;
      }

      currentUser = normalizeSession(session);
      renderUser(currentUser);
      applyRoleUI(currentUser.Role || currentUser.role);
    }

    function renderUser(session) {
      const name =
        session.FullName ||
        session.fullName ||
        session.name ||
        session.Username ||
        session.username ||
        "User";

      const role = session.Role || session.role || "---";

      userName.textContent = name;
      userRole.textContent = normalizeRoleLabel(role);

      const firstLetter = String(name).trim().charAt(0) || "U";
      userAvatar.textContent = firstLetter;
    }

    function normalizeRoleLabel(role) {
      const cleanRole = String(role || "").toLowerCase();

      if (cleanRole === "admin") return t("roleAdmin");
      if (cleanRole === "supervisor") return t("roleSupervisor");

      return role || "---";
    }

    function isAdmin() {
      return String(currentUser?.Role || currentUser?.role || "").toLowerCase() === "admin";
    }

    function applyRoleUI(role) {
      const cleanRole = String(role || "").toLowerCase();

      document.querySelectorAll(".admin-only").forEach(el => {
        el.style.display = cleanRole === "admin" ? "" : "none";
      });
    }

    async function loadWorkers() {
      if (!currentUser || !currentUser.token) {
        hideLoading();
        showMessage(t("tokenMissing"), "error");
        return;
      }

      try {
        const result = await apiPost({
          action: "getWorkers",
          token: currentUser.token,
          activeOnly: false
        });

        hideLoading();

        if (!result || !result.success) {
          showMessage((result && result.message) || t("loadFailed"), "error");
          workers = [];
          renderWorkersTable();
          return;
        }

        workers = result.workers || [];
        renderWorkersTable();

      } catch (error) {
        console.error(error);
        hideLoading();
        showMessage(t("serverError"), "error");
        workers = [];
        renderWorkersTable();
      }
    }

    function normalizeWorkerName(name) {
      return String(name || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function workerNameExists(name, excludeWorkerId = "") {
      const cleanName = normalizeWorkerName(name);

      return workers.some(worker => {
        const sameName = normalizeWorkerName(worker.WorkerName) === cleanName;
        const sameId = String(worker.WorkerID || "") === String(excludeWorkerId || "");

        return sameName && !sameId;
      });
    }

    function getFilteredWorkers() {
      const keyword = String(workersSearchInput.value || "").trim().toLowerCase();
      const selectedStatus = statusFilterInput.value || "all";

      return workers.filter(worker => {
        const workerStatus = normalizeStatus(worker.Status || "Active");

        if (selectedStatus !== "all" && workerStatus !== selectedStatus) {
          return false;
        }

        if (!keyword) {
          return true;
        }

        const workerId = String(worker.WorkerID || "").toLowerCase();
        const workerName = String(worker.WorkerName || "").toLowerCase();
        const statusText = workerStatus === "Active" ? t("active") : t("inactive");

        return workerId.includes(keyword) ||
          workerName.includes(keyword) ||
          statusText.toLowerCase().includes(keyword);
      });
    }

    function renderWorkersTable() {
      workersTableBody.innerHTML = "";

      const filteredWorkers = getFilteredWorkers();

      if (!filteredWorkers.length) {
        const colspan = isAdmin() ? 4 : 3;
        workersTableBody.innerHTML = `
          <tr>
            <td colspan="${colspan}">
              <div class="empty-state">${t("emptyData")}</div>
            </td>
          </tr>
        `;
        return;
      }

      filteredWorkers.forEach(worker => {
        const workerId = worker.WorkerID || "";
        const workerName = worker.WorkerName || "";
        const status = normalizeStatus(worker.Status || "Active");
        const active = status === "Active";

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td class="id-cell">${escapeHtml(workerId)}</td>
          <td>${escapeHtml(workerName)}</td>
          <td>
            <span class="status-pill ${active ? "status-active" : "status-inactive"}">
              ${active ? t("active") : t("inactive")}
            </span>
          </td>
          ${
            isAdmin()
              ? `
                <td>
                  <div class="table-actions">
                    <button class="btn btn-secondary btn-small edit-worker-btn" type="button" data-id="${escapeHtml(workerId)}">
                      ${t("edit")}
                    </button>
                  </div>
                </td>
              `
              : ""
          }
        `;

        workersTableBody.appendChild(tr);
      });
    }

    function bindEvents() {
      openAddWorkerBtn.addEventListener("click", openAddWorkerModal);
      closeAddWorkerModalBtn.addEventListener("click", closeAddWorkerModal);
      cancelWorkerBtn.addEventListener("click", closeAddWorkerModal);

      addWorkerModal.addEventListener("click", event => {
        if (event.target === addWorkerModal) {
          closeAddWorkerModal();
        }
      });

      workerForm.addEventListener("submit", handleAddWorker);

      workersSearchInput.addEventListener("input", renderWorkersTable);
      statusFilterInput.addEventListener("change", renderWorkersTable);

      workersTableBody.addEventListener("click", event => {
        const editBtn = event.target.closest(".edit-worker-btn");

        if (editBtn) {
          openEditWorker(editBtn.dataset.id);
        }
      });

      closeEditModalBtn.addEventListener("click", closeEditModal);
      cancelEditWorkerBtn.addEventListener("click", closeEditModal);

      editModal.addEventListener("click", event => {
        if (event.target === editModal) {
          closeEditModal();
        }
      });

      editWorkerForm.addEventListener("submit", handleUpdateWorker);

      logoutBtn.addEventListener("click", async () => {
        const session = getSession();

        try {
          if (session && session.token && API_URL) {
            await apiPost({
              action: "logout",
              token: session.token
            });
          }
        } catch (error) {
          console.warn(error);
        }

        localStorage.removeItem(SESSION_KEY);
        window.location.href = "index.html";
      });
    }

    function openAddWorkerModal() {
      resetAddForm();
      addWorkerModal.classList.add("show");
      document.body.style.overflow = "hidden";
      setTimeout(() => workerNameInput.focus(), 50);
    }

    function closeAddWorkerModal() {
      addWorkerModal.classList.remove("show");
      document.body.style.overflow = "";
      resetAddForm();
    }

    async function handleAddWorker(event) {
      event.preventDefault();
      clearMessage();

      const workerName = workerNameInput.value.trim();
      const status = workerStatusInput.value || "Active";

      if (!workerName) {
        showMessage(t("nameRequired"), "error");
        return;
      }

      if (workerNameExists(workerName)) {
        showMessage(t("duplicateWorkerName"), "error");
        return;
      }

      setButtonLoading(saveWorkerBtn, true, t("saving"));

      try {
        const result = await apiPost({
          action: "addWorker",
          token: currentUser.token,
          worker: {
            workerName: workerName,
            status: status
          }
        });

        setButtonLoading(saveWorkerBtn, false, t("save"));

        if (!result || !result.success) {
          showMessage((result && result.message) || t("serverError"), "error");
          return;
        }

        closeAddWorkerModal();
        showMessage(result.message || t("addSuccess"), "success");
        await loadWorkers();

      } catch (error) {
        console.error(error);
        setButtonLoading(saveWorkerBtn, false, t("save"));
        showMessage(t("serverError"), "error");
      }
    }

    function openEditWorker(workerId) {
      const worker = workers.find(item => String(item.WorkerID) === String(workerId));

      if (!worker) return;

      editWorkerId.value = worker.WorkerID || "";
      editWorkerName.value = worker.WorkerName || "";
      editWorkerStatus.value = normalizeStatus(worker.Status || "Active");

      editModal.classList.add("show");
      document.body.style.overflow = "hidden";
      setTimeout(() => editWorkerName.focus(), 50);
    }

    function closeEditModal() {
      editModal.classList.remove("show");
      document.body.style.overflow = "";
      editWorkerForm.reset();
    }

    async function handleUpdateWorker(event) {
      event.preventDefault();
      clearMessage();

      const workerId = editWorkerId.value.trim();
      const workerName = editWorkerName.value.trim();
      const status = editWorkerStatus.value || "Active";

      if (!workerName) {
        showMessage(t("nameRequired"), "error");
        return;
      }

      if (workerNameExists(workerName, workerId)) {
        showMessage(t("duplicateWorkerNameEdit"), "error");
        return;
      }

      setButtonLoading(updateWorkerBtn, true, t("saving"));

      try {
        const result = await apiPost({
          action: "updateWorker",
          token: currentUser.token,
          worker: {
            workerId: workerId,
            workerName: workerName,
            status: status
          }
        });

        setButtonLoading(updateWorkerBtn, false, t("saveChanges"));

        if (!result || !result.success) {
          showMessage((result && result.message) || t("serverError"), "error");
          return;
        }

        closeEditModal();
        showMessage(result.message || t("updateSuccess"), "success");
        await loadWorkers();

      } catch (error) {
        console.error(error);
        setButtonLoading(updateWorkerBtn, false, t("saveChanges"));
        showMessage(t("serverError"), "error");
      }
    }

    function resetAddForm() {
      workerForm.reset();
      workerStatusInput.value = "Active";
    }

    async function apiPost(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return await response.json();
    }

    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (error) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }

    function initSidebar() {
      menuBtn.addEventListener("click", openSidebar);
      closeSidebarBtn.addEventListener("click", closeSidebar);
      overlay.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeSidebar();
          closeAddWorkerModal();
          closeEditModal();
        }
      });

      document.querySelectorAll(".nav a").forEach(link => {
        link.addEventListener("click", closeSidebar);
      });
    }

    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("show");

      if (!addWorkerModal.classList.contains("show") && !editModal.classList.contains("show")) {
        document.body.style.overflow = "";
      }
    }

    function initLanguage() {
      languageToggleBtn.addEventListener("click", () => {
        const nextLang = currentLang === "ar" ? "en" : "ar";
        applyLanguage(nextLang);
      });
    }

    function normalizeStatus(status) {
      const value = String(status || "").toLowerCase();

      if (
        value === "active" ||
        value === "نشط" ||
        value === "مفعل" ||
        value === "فعال"
      ) {
        return "Active";
      }

      return "Inactive";
    }

    function hideLoading() {
      loadingBox.style.display = "none";
    }

    function setButtonLoading(button, isLoading, text) {
      button.disabled = isLoading;

      if (isLoading) {
        button.innerHTML = '<span class="mini-spinner"></span>' + text;
      } else {
        button.textContent = text;
      }
    }

    function showMessage(text, type) {
      clearTimeout(messageTimer);

      messageBox.textContent = text;
      messageBox.className = "message " + type;

      messageTimer = setTimeout(() => {
        clearMessage();
      }, 3000);
    }

    function clearMessage() {
      clearTimeout(messageTimer);
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
